name: 'Release Notes Generator'
description: 'Generate and post release notes from GitHub PRs to Slack using AI'

inputs:
  repos:
    description: 'Comma-separated list of repositories to analyze (e.g., "org1/repo1,org2/repo2")'
    required: true
  github_token:
    description: 'GitHub Personal Access Token with repo access'
    required: true
  slack_bot_token:
    description: 'Slack Bot Token'
    required: true
  slack_channel:
    description: 'Slack channel to post to (e.g., #release-notes)'
    required: true
  ai_provider:
    description: 'AI provider to use (openai or claude)'
    required: false
    default: 'openai'
  openai_api_key:
    description: 'OpenAI API key (required if ai_provider is openai)'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (required if ai_provider is claude)'
    required: false
  ai_model:
    description: 'Optional model name to override the provider default (e.g. claude-haiku-4-5-20251001, gpt-4o-mini)'
    required: false
    default: ''
  days_back:
    description: 'Number of days to look back for PRs'
    required: false
    default: '7'

outputs:
  message:
    description: 'The generated release notes message'
    value: ${{ steps.generate-notes.outputs.message }}
  timestamp:
    description: 'Timestamp of when the notes were generated'
    value: ${{ steps.generate-notes.outputs.timestamp }}

runs:
  using: 'composite'
  steps:
    - name: Checkout action code
      uses: actions/checkout@v7
      with:
        repository: delivops/release-notes-generator
        path: release-notes-generator-action
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      shell: bash
      run: |
        pip install -r release-notes-generator-action/requirements.txt
        
    - name: Generate release notes
      id: generate-notes
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL: ${{ inputs.slack_channel }}
        AI_PROVIDER: ${{ inputs.ai_provider }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        AI_MODEL: ${{ inputs.ai_model }}
      run: |
        python release-notes-generator-action/scripts/generate_release_notes.py \
          --repos "${{ inputs.repos }}" \
          --days-back ${{ inputs.days_back }}
        
        # Read the generated message and write it to the step output.
        # Use a unique random delimiter so the generated content can never
        # collide with the heredoc terminator (the static "EOF" delimiter
        # broke when the AI output contained a line equal to "EOF").
        if [ -f "generated_message.txt" ]; then
          delimiter="ghadelimiter_$(openssl rand -hex 16)"
          {
            echo "message<<${delimiter}"
            cat generated_message.txt
            # Ensure the closing delimiter starts on its own line even when
            # the generated file has no trailing newline; otherwise it gets
            # glued onto the last content line and GitHub reports
            # "Matching delimiter not found".
            [ -n "$(tail -c1 generated_message.txt)" ] && echo ""
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-notes-artifacts
        path: |
          generated_message.txt
        retention-days: 30 